#? Config file for btop4win v. 1.0.5

# Windows Terminal supports these colors and graph characters.
color_theme = "Default"
theme_background = True
truecolor = True
force_tty = False
rounded_corners = True
graph_symbol = "block"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

# LibreHardwareMonitor provides GPU, temperature and accurate clock data.
enable_ohmr = True
show_gpu = True
selected_gpu = "Auto"

# Performance-focused layout and refresh rate.
shown_boxes = "cpu mem proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_services = False
services_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_left = False

# Show CPU and GPU utilization together in the main graph.
cpu_graph_upper = "total"
cpu_graph_lower = "gpu"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
show_coretemp = True
temp_scale = "celsius"

# Memory, disk and battery details.
mem_graphs = True
mem_below_net = False
show_page = True
show_disks = True
only_physical = True
disk_free_priv = False
show_io_stat = True
io_mode = False
io_graph_combined = False
show_battery = True

# Network scaling is automatic if the panel is enabled from the UI.
net_download = 100
net_upload = 100
net_auto = True
net_sync = False
net_iface = ""

clock_format = "%X"
background_update = True
base_10_sizes = False
log_level = "WARNING"

